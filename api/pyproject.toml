[project]
name = "repscore-pipeline-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0",
    "url-verification",
    # Company Monitor is imported from its folder (monitor_bridge.py), not installed. These are the entries of its
    # requirements.txt that bulk_search, monitor, net and dataforseo_serp import. test_bridge.py fails if one is missing.
    "requests>=2.31",
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
]

[tool.uv.sources]
url-verification = { path = "../../url-verification", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # starlette's TestClient warns (filterwarnings=error turns it into a failure) unless httpx2 is also installed.
    "httpx2>=2.13.1",
    "ruff>=0.7",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # url-verification's HttpFetcher (curl_cffi) and the local test HTTP server it talks to leave a socket that is
    # only reclaimed by later GC, well after the test that used it returns - a pre-existing, benign leak in that
    # sibling repo's own test suite too (its pytest.ini just does not turn warnings into errors). It surfaces here,
    # attributed to whatever test happens to be running when the GC pass fires, only because real_verify's tests
    # exercise the real pipeline against a local server as required. Narrowly ignored rather than silencing
    # ResourceWarning (or PytestUnraisableExceptionWarning) as a whole, so any other unraisable exception still fails.
    "ignore:Exception ignored in.*socket\\.socket:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["pipeline_api", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
